name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generate-and-check:
    # Render the template and run the generated service's full check, like a real service would.
    # Every combination of `with_database` and `with_cache`; the database and cache variants also
    # run their integration tests (testcontainers on the runner's Docker).
    name: generate-and-check (with_database=${{ matrix.with_database }}, with_cache=${{ matrix.with_cache }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        with_database: [true, false]
        with_cache: [true, false]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # copier needs tags/history to render
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Render template
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            -d service_name=meal-sample -d python_version=3.14 \
            -d with_database=${{ matrix.with_database }} \
            -d with_cache=${{ matrix.with_cache }} \
            . "$RUNNER_TEMP/meal-sample"
      # The generated service's two Trivy scans (template/.github/workflows/ci.yml; keep the
      # inputs and the pinned commit in sync), so a template change that adds a HIGH or
      # CRITICAL finding fails here. The fs scan runs before `uv sync` creates `.venv`, on
      # the same files as a service checkout.
      - name: Trivy scans the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/meal-sample
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ runner.temp }}/meal-sample/.trivyignore
      - name: make check
        working-directory: ${{ runner.temp }}/meal-sample
        run: |
          uv sync --locked
          make check
      - name: pre-commit
        working-directory: ${{ runner.temp }}/meal-sample
        run: |
          git add -A
          uv run pre-commit run --all-files
      - name: Agent docs reference what exists
        working-directory: ${{ runner.temp }}/meal-sample
        # Links, anchors and code names in AGENTS.md, README.md, docs/ and skills.
        run: uv run python "$GITHUB_WORKSPACE/tools/docs-check/check_refs.py" .
      - name: Agent doc examples pass make check
        working-directory: ${{ runner.temp }}/meal-sample
        # Pastes each doc's and skill's examples into the service, one file at a time.
        run: python3 "$GITHUB_WORKSPACE/tools/docs-check/check_examples.py" .
      - name: Layer contracts reject forbidden imports
        working-directory: ${{ runner.temp }}/meal-sample
        run: |
          # Each module is imported from the domain in turn; `make imports` must fail.
          for module in meal_sample.settings; do
            echo "import $module  # noqa: F401" > src/meal_sample/domain/_violation.py
            if make imports; then
              echo "::error::domain may import $module"
              exit 1
            fi
          done
          rm src/meal_sample/domain/_violation.py
      - name: Docker image builds
        working-directory: ${{ runner.temp }}/meal-sample
        run: docker build -t meal-sample:ci .
      - name: Trivy scans the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meal-sample:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ runner.temp }}/meal-sample/.trivyignore
          skip-setup-trivy: true # installed by the repository scan
